version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    ignore:
      # v11 removes the event/span and PII controls used by our privacy scrubber.
      # Migrate and test that boundary before changing the browser SDK major.
      - dependency-name: "@sentry/browser"
        update-types: ["version-update:semver-major"]
      # @types/node follows the Node 24 runtime pinned in package.json engines
      # and CI. Raise its major together with that runtime, not on its own.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
